[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moon-poro-bot"
version = "0.2.0"
description = "Modular Discord bot for a League of Legends community"
readme = "README.md"
authors = [{ name = "Ceendi" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "discord.py>=2.6,<3",
    "pulsefire>=2,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "SQLAlchemy>=2.0.36,<2.1",
]

[project.urls]
Repository = "https://github.com/Ceendi/Moon-Poro-Bot"
Issues = "https://github.com/Ceendi/Moon-Poro-Bot/issues"

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2",
    "detect-secrets>=1.5,<2",
    "mypy>=1.14,<2",
    "pip-audit>=2.10,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7,<8",
    "pylint>=4,<5",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["moon_poro*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"
cache_dir = ".pytest_runtime_cache"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["moon_poro"]

[tool.coverage.report]
fail_under = 60
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = true
